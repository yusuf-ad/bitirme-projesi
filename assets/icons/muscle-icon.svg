<line x1="45" y1="21" x2="45" y2="33" stroke="#718096" stroke-width="0.5"/>

<!-- Weight text/numbers -->
<text x="10" y="28" font-family="Inter, Arial, sans-serif" font-size="4" font-weight="bold" fill="#A0AEC0" text-anchor="middle">20</text>
<text x="44" y="28" font-family="Inter, Arial, sans-serif" font-size="4" font-weight="bold" fill="#A0AEC0" text-anchor="middle">20</text>

